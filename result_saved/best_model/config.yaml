# days: [0, 7] # Day range [start, end): simulate days 0-6
# y1: 166 # Spatial crop: row start
# y2: 453 # Spatial crop: row end
# x1: 166 # Spatial crop: col start
# x2: 581 # Spatial crop: col end
data:
  base_dir: "data/data_real" # Root directory for fire event data
  train_events: # Training fire events (name → crop/days)
    "Bear_2020":
      days: [0, 10]
      y1: 166
      y2: 453
      x1: 166
      x2: 581
    "Ferguson_2018":
      days: [0, 10]
      y1: 166
      y2: 1149
      x1: 166
      x2: 988
    "Brattain_2020":
      days: [0, 10]
      y1: 166
      y2: 918
      x1: 166
      x2: 842
    "Chimney_2016":
      days: [0, 10]
      y1: 166
      y2: 723
      x1: 166
      x2: 819
    "Buck_2017":
      days: [0, 10]
      y1: 0
      y2: 455
      x1: 0
      x2: 473
    "Pier_2017":
      days: [0, 10]
      y1: 0
      y2: 679
      x1: 0
      x2: 706
  test_events: # Validation/test fire events
    # "Pier_2017":
    #   days: [7, 10]
    #   y1: 0
    #   y2: 679
    #   x1: 0
    #   x2: 706
    # "Bear_2020":
