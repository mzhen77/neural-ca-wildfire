[project]
name = "neural-ca-wildfire"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.0.1",
    "ipython>=9.6.0",
    "pandas>=2.3.3",
    "matplotlib>=3.10.7",
    "jax>=0.8.0 ; sys_platform == 'win32'",
    # "jax[cuda13]; sys_platform == 'Linux'", # WSL
    "jax[cuda12]>=0.9.0; sys_platform == 'linux'",
    # "jax-cuda12-plugin>=0.9.0; sys_platform == 'Linux'",
    # "diffrax>=0.7.0",
    # "optimistix>=0.0.11",
    "notebook>=7.4.7",
    # "ompython>=4.0.0",
    # "pygame>=2.6.1",
    # "scipy>=1.16.3",
    "numpy>=2.3.5",
    # "osmnx>=2.0.7",
    # "geopandas>=1.1.1",
    # "networkx>=3.6.1",
    "optax>=0.2.6",
    "opencv-python>=4.10.0",
    # "pytorchfire>=1.0.3.post2",
    # "torch>=2.9.1",
    # "tqdm>=4.67.1",
    "h5py>=3.15.1",
    # "einops>=0.8.1",
    # "scikit-learn>=1.8.0",
    # "flax>=0.12.3",
    "pytest>=9.0.2",
    "seaborn>=0.13.2",
    "equinox>=0.13.8",
]

[tool.uv]
allow-insecure-host = ["download.pytorch.org", "download-r2.pytorch.org"]
native-tls = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "platform_system == 'Windows'" }
torchvision = { index = "pytorch-cu130", marker = "platform_system == 'Windows'" }
