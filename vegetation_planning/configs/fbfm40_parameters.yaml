treatment_assumptions:
  note: "Each pairing is an assumption about the post-treatment fuel model. Source for the set of observed post-treatment classes: Stephens et al. (2009), Fire Ecology 5(2), 14-29 (pre-treatment TL8 and TU5 reassigned among TL1, TL3, TL4, TL5, TU1, TU2, GS1, SH2). Class choice within that set follows the GTR-153 selection guide."
  TB:                                  # thinning followed by prescribed burning
    TL8: {primary: TL3, alternative: TL1}
    TU5: {primary: TU1, alternative: TL3}
