provenance:
  table: Scott, J.H., Burgan, R.E. (2005). Standard fire behavior fuel models. USDA Forest Service RMRS-GTR-153, Table 7 (fuel model parameters), Tables 3 and 4 (moisture scenarios), p. 7 (constants).
  pdf: https://research.fs.usda.gov/download/treesearch/9521.pdf
  transcribed: 2026-10-21 from the text of Table 7 (11 models); all 40 models checked and completed on 2026-10-28. Loads in tons per acre, SAV in 1/ft, depth in ft, extinction moisture in percent, heat content in BTU/lb.
constants:
  sav_10h_per_ft: 109.0          # GTR-153 p. 7: "10-hr dead fuel SAV is 109 1/ft, and 100-hr SAV is 30 1/ft"
  sav_100h_per_ft: 30.0
  particle_density_lb_ft3: 32.0  # Rothermel (1972) standard particle properties, retained by GTR-153 p. 7
  total_mineral_fraction: 0.0555
  effective_mineral_fraction: 0.010
  herb_cured_moisture_percent: 30.0    # GTR-153 p. 6: fully cured at or below 30 percent
  herb_green_moisture_percent: 120.0   # uncured at or above 120 percent
  tons_per_acre_to_lb_per_ft2: 0.0459137
moisture_scenarios:                    # GTR-153 Tables 3 and 4, percent
  D1: {dead_1h: 3, dead_10h: 4, dead_100h: 5}
  D2: {dead_1h: 6, dead_10h: 7, dead_100h: 8}
  D3: {dead_1h: 9, dead_10h: 10, dead_100h: 11}
  D4: {dead_1h: 12, dead_10h: 13, dead_100h: 14}
  L1: {live_herb: 30, live_woody: 60}
  L2: {live_herb: 60, live_woody: 90}
  L3: {live_herb: 90, live_woody: 120}
  L4: {live_herb: 120, live_woody: 150}
